  <style>
    /* 文件浏览器样�?*/

    .file-browser {

      height: 100%;

      display: flex;

      flex-direction: column;

      background: #fff;
      /* 确保有背景不被透过�?*/

      position: relative;
      /* 形成层叠上下�?*/

      z-index: 1;
      /* 高于右侧预览中的内嵌内容 */

    }



    /* 新增：文件浏览器拖拽上传高亮样式 */

    .file-browser.drag-over {

      outline: 2px dashed #3b82f6;

      outline-offset: -4px;

      background: #eff6ff;

    }

    .file-browser.drag-over::after {

      content: '拖拽文件到这里上传作业';

      position: absolute;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #1d4ed8;

      font-size: 14px;

      font-weight: 500;

      background: rgba(255, 255, 255, 0.7);

      pointer-events: none;

    }



    .file-list {

      flex: 1;

      overflow-y: auto;

      padding: 8px;

      max-height: none !important;
      /* 移除高度上限，避免与右侧不同�?*/

      min-height: 0;
      /* 避免内部滚动塌陷 */

    }



    .file-item {

      padding: 6px 8px;

      border-radius: 4px;

      cursor: pointer;

      margin-bottom: 2px;

      display: flex;

      align-items: center;

      justify-content: space-between;

    }



    .file-item:hover {

      background: #f0f0f0;

    }



    .file-item.active {

      background: #e3f2fd;

      color: #1976d2;

    }



    .file-icon {

      margin-right: 8px;

      width: 16px;

      text-align: center;

    }


    .editor-container {

      display: grid;

      /* 初始网格布局（由 JS 动态调整行高） */

      grid-template-rows: 1fr 10px 1fr;

      grid-template-areas:

        "editor"

        "handle"

        "output";

      gap: 14px;

      height: 100%;

      overflow: auto;
      /* 关键：防止内部计算误差导致整体滚动 */

    }



    .editor-pane {

      display: flex;

      flex-direction: column;

      flex: 1 1 auto;

      min-height: 120px;

      background: var(--card);

      border-radius: 18px;

      box-shadow: var(--shadow);

      overflow: auto;

      grid-area: editor;

      /* 取消依赖 JS 改高度，仅靠 grid 控制高度 */

    }



    .resize-handle {

      grid-area: handle;

      height: 10px;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: ns-resize;

      /* 确保分隔线永远在内容之上，不会“消失�?*/

      z-index: 10;

      user-select: none;

    }



    /* 增强分隔线可视�?*/

    .resize-handle:hover .resize-bar {

      background: rgba(15, 23, 42, .4);

    }



    .output-pane {

      background: var(--card);

      border-radius: 18px;

      box-shadow: var(--shadow);

      padding: 16px;

      display: flex;

      flex-direction: column;

      gap: 12px;

      grid-area: output;

      min-height: 0;
      overflow: auto;
      max-height: 100%;

      /* 输出区实际高度交�?grid 的第三行 (1fr) 来决定，不再强行写死高度 */

    }

    .pdf-preview {

      border: 1px solid #e2e8f0;

      border-radius: 14px;

      background: #fff;

      display: none;

      /* 关键：用 flex 让内�?embed 完整填充 */

      display: none;

      overflow: auto;

      flex: 1;

      min-height: 0;

      align-items: stretch;

      justify-content: stretch;

    }



    .pdf-preview.active {

      display: flex;

    }



    .pdf-embed {

      width: 100%;

      height: 100%;

      border: 0;

      display: block;

      background: #fff;

    .docx-editor-preview .docx-content p {

      margin: 6px 0;

    .docx-editor-preview .docx-content img {

      height: auto;

      display: inline-block;

    .image-preview {

      border-radius: 14px;

      background: #fff;

      display: none;

      overflow: auto;

      flex: 1;

      min-height: 0;

    .image-preview.active {

      display: flex;

    }

    .image-embed {

      width: 100%;

      height: 100%;

      object-fit: contain;

      display: block;

      background: #fff;

    }



    /* 评测结果表格样式 */

    .grade-table {

      width: 100%;

      border-collapse: collapse;
      table-layout: fixed;

      background: white;

    }



    .grade-table th,

    .grade-table td {

      border: 1px solid #ddd;

      padding: 6px 8px;

	      overflow-wrap: break-word;

    .grade-summary {

    }

    .file-path {

      border-bottom: 1px solid #e2e8f0;

      font-size: 12px;

      color: #475569;

      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;

    }



    .empty-state {

    /* 作业状态样�?*/

    .homework-status {

    .status-submitted {

    .hw-actions {

    .hw-actions-buttons {

      display: flex;

      gap: 10px;

    }



    .hw-btn {

      border: none;

      border-radius: 999px;

      padding: 10px 22px;

      font-size: 15px;

      font-weight: 600;

      background: rgba(15, 23, 42, 0.06);

      color: #0f172a;

      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);

      cursor: pointer;

      transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;

    }



    .hw-btn.primary {

      background: linear-gradient(120deg, #4338ca, #6366f1);

      color: #fff;

    }



    .hw-btn.explain {

      background: linear-gradient(120deg, #ec4899, #f472b6);

      color: #fff;

    }



    .hw-btn.accent {

      background: linear-gradient(120deg, #0ea5e9, #38bdf8);

      color: #fff;

    }



    .hw-btn:disabled {

      opacity: .45;

      cursor: not-allowed;

      box-shadow: none;

      transform: none;

    }



    .status-pill {

      align-items: center;

      gap: 6px;

      padding: 6px 14px;

      border-radius: 999px;

      font-weight: 600;

    }



    .output-placeholder {

      flex: 1;

      display: flex;

      align-items: center;

      justify-content: center;

      color: #94a3b8;

      font-size: 14px;

      text-align: center;

      border: 1px dashed #cbd5f5;

      border-radius: 14px;

      padding: 12px;

    }



    /* Editor highlight overlay (GitHub light-like) */

    .editor-wrapper {

      position: relative;

      flex: 1;

      background: #fff;

      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;

      display: flex;

      flex-direction: column;

      overflow: auto;

    }

    /* CodeMirror 编辑器容器样式 */
    .codemirror-container {
      flex: 1;
      min-height: 0;
      /* 避免在 flex/grid 中被挤压为 0 */
      min-width: 0;
      overflow: auto;
      background: #fff;
      border-radius: 0;
      display: flex;
      /* 让 CodeMirror 自己撑满 */
    }

    .codemirror-container .CodeMirror {
      flex: 1;
      height: 100% !important;
      width: 100% !important;
      font-family: 'Consolas', 'Monaco', 'Courier New', monospace !important;
      font-size: 14px !important;
      line-height: 1.6 !important;
    }

    .codemirror-container .CodeMirror-linenumber {
      color: #9ca3af;
      font-size: 13px;
    }

    .codemirror-container .CodeMirror-cursor {
      border-left: 2px solid #2563eb;
      height: 1.6em;
    }

    .codemirror-container .CodeMirror-selected {
      background: #dbeafe;
    }

    .codemirror-container .CodeMirror-line::selection,
    .codemirror-container .CodeMirror-line>span::selection {
      background: #dbeafe;
    }

    .codemirror-container .CodeMirror-line::-moz-selection,
    .codemirror-container .CodeMirror-line>span::-moz-selection {
      background: #dbeafe;
    }



    /* 旧的高亮覆盖层（pre/textarea）在使用 CodeMirror 后全部禁用，避免挡住编辑器 */
    /* .editor-wrapper pre,
    .editor-wrapper textarea {
      display: none !important;
    } */



    /* VS Code Light 风格�?highlight.js 覆盖 */

    .hljs {

      background: #fff !important;

    }

    .hljs-comment,

    }

    }

    }

    }

    }

    }

    }

    }



    /* 在原样式下方新增或合并以下覆�?*/

    .editor-wrapper pre,

    .editor-wrapper pre code {

      font-family: 'Consolas', 'Monaco', 'Courier New', monospace;

      font-size: 14px;

      line-height: 1.6;

      letter-spacing: .2px;

      /* �?textarea 保持一�?*/

      tab-size: 4;

      -moz-tab-size: 4;

      white-space: pre-wrap;

      /* �?textarea 默认换行接近；如需不换行改�?pre */

      box-sizing: border-box;

    }



    /* 确保两层滚动条宽度一致（避免出现滚动差异�?*/

    .editor-wrapper pre {

      overflow: auto;

    }



    /* 追加：统一行高/连字/换行，确保两层完全一�?*/

    .editor-wrapper textarea,

    .editor-wrapper pre,

    .editor-wrapper pre code {

      font-variant-ligatures: none;

      font-feature-settings: "liga" 0, "calt" 0;

      tab-size: 4;

      -moz-tab-size: 4;

      scrollbar-gutter: stable;

      /* 避免滚动条出现时抖动 */

    }



    /* 使用固定像素行高以避�?1.6 的小数像素舍入差�?*/

    /* 修复光标错位：强制统一字体、行高、间�?*/

    .editor-wrapper textarea,

    .editor-wrapper pre {

      font-family: 'Consolas', 'Monaco', 'Courier New', monospace !important;

      font-size: 14px !important;

      line-height: 22px !important;

      /* 必须使用整数像素 */

      letter-spacing: 0 !important;

      /* 必须�? */

      padding: 20px !important;

      tab-size: 4 !important;

      -moz-tab-size: 4 !important;

    }



    /* 修正：code 元素不应�?padding，否则会�?pre �?padding 叠加导致错位 */

    .editor-wrapper pre code {

      font-family: inherit !important;

      font-size: inherit !important;

      line-height: inherit !important;

      letter-spacing: inherit !important;

      padding: 0 !important;

      tab-size: inherit !important;

      background: transparent !important;

    }



    /* 修复换行策略不一致导致的错位 */

    .editor-wrapper textarea {

      white-space: pre !important;

      overflow-wrap: normal !important;

      overflow-x: auto !important;

      z-index: 3;

    }



    .editor-wrapper pre {

      white-space: pre !important;

      overflow-wrap: normal !important;

      z-index: 1;

      pointer-events: none;

    }

      font-weight: normal !important;

      font-style: normal !important;

    }

      position: fixed;

      right: 16px;

      background: #ffffffcc;

      pointer-events: none;

    .editor-wrapper .CodeMirror pre {

      font-family: inherit !important;

<body>
  <!-- 跳过导航链接，为键盘用户和屏幕阅读器用户提供便利 -->
  <a href="#main-content" class="skip-link">跳过导航直接进入主要内容</a>

  <div class="page">

    <div class="header with-back" role="banner">

      <a href="./course.html" class="back-chip" aria-label="返回课程页面" title="返回课程页面">

        <span aria-hidden="true">←</span>
        <span>返回</span>
      </a>

      <h2 id="page-title">平时作业</h2>

    </div>

    <div class="split">

      <div class="file-browser" role="complementary" aria-label="文件浏览器">
        <div class="file-list" id="fileList" role="listbox" aria-label="文件列表"></div>

      <div class="editor-container" role="main" aria-labelledby="page-title" id="main-content">

        const submissionResult = await window.api.getStudentSubmissionStatus(sid, className);
        
        if (submissionResult && submissionResult.success) {
          const submissions = submissionResult.submissions || [];
          
          log.info('Loaded submissions from server', { 
            count: submissions.length,
            files: submissions.map(s => s.file_name)
          });

          // 从服务器响应中提取已提交的文件名列表
          const submittedFileNames = submissions
            .filter(s => s.is_submitted && s.file_name)
            .map(s => normalizeSubmittedFilename(s.file_name))
            .filter(name => name !== '');
          
          // 合并服务器的提交状态和本地待提交状态
          submittedFiles = Array.from(new Set([...submittedFileNames, ...pendingSubmittedFiles]));

          log.info('Fetched submitted files from server', { count: submittedFiles.length });
        } else {
          log.warn('Failed to fetch submission status from server, using empty list');
          submittedFiles = [...pendingSubmittedFiles];
        }

        // 更新下载已提交按钮状态
        updateDownloadSubmittedButtonState();

        // 尝试从服务器获取视频文件列表和作业文件列表
        try {
          const result = await window.api.homeworkInfo(sid, className);
          if (result && result.success) {
            // 后端返回的是对象数组 [{filename, url, full_url}]
            const rawVideoFiles = result.video_files || [];

            // 存储完整的视频对象（包含 URL）
            videoFilesWithUrl = rawVideoFiles.filter(video =>
              typeof video === 'object' && video.filename && video.url
            );

            // 提取文件名用于匹配
            videoFiles = videoFilesWithUrl.map(video => video.filename);

            log.info('Fetched video files from server', { count: videoFiles.length });
          } else {
            videoFiles = [];
            videoFilesWithUrl = [];
          }
        } catch (e) {
          log.warn('Failed to fetch video files from server, using empty list', e);
          videoFiles = [];
          videoFilesWithUrl = [];
        }

        // 更新讲解按钮状态
        updateExplanationButtonState();

      } catch (error) {

        log.error('加载作业信息失败', error);

        // 即使出错，也使用本地待提交状态
        submittedFiles = [...pendingSubmittedFiles];
        videoFiles = [];
        videoFilesWithUrl = [];
        log.info('Using pending submissions after error', { count: submittedFiles.length });

      } finally {
        // 更新下载已提交按钮状态
        updateDownloadSubmittedButtonState();
      }

    }

        // 首先尝试读取提交索引
        const indexKey = 'submissions_index';
        const indexData = await window.api.cacheRead(sid, indexKey);
        
        if (indexData) {
          const index = JSON.parse(indexData);
          if (Array.isArray(index.files)) {
            for (const filename of index.files) {
              const cacheKey = `${cachePrefix}${filename}`;
              const cached = await window.api.cacheRead(sid, cacheKey);
              if (cached) {
                submissions[filename] = JSON.parse(cached);
              }
            }
          }
        }
        
        return submissions;
      } catch (e) {
        log.warn('Failed to load all cached submissions', e);
        return {};
      }
    }

    // 保存提交索引（记录所有已提交的文件）
    async function saveSubmissionIndex(filename) {
      try {
        const indexKey = 'submissions_index';
        let index = { files: [] };
        
        // 读取现有索引
        const existing = await window.api.cacheRead(sid, indexKey);
        if (existing) {
          index = JSON.parse(existing);
        }
        
        // 添加新文件（如果不存在）
        if (!index.files.includes(filename)) {
          index.files.push(filename);
          await window.api.cacheWrite(sid, indexKey, JSON.stringify(index));
          log.info('Updated submissions index', { filename });
        }
      } catch (e) {
        log.warn('Failed to save submission index', e);
      }
    }

    // 检查文件是否已提交

    function normalizeSubmittedFilename(filename) {

      const text = String(filename || '').trim();

      if (!text) return '';

      const basename = getPathBasename(text);

      return basename.replace(/^\d+_/, '');

    }

    // 保存提交结果到本地缓存
    async function saveSubmissionResult(filePath, result) {
      try {
        const filename = getPathBasename(filePath);
        if (!filename) return;

        const submissionData = {
          filename: filename,
          filePath: filePath,
          submitTime: new Date().toISOString(),
          result: result,
          problemId: getProblemIdFromFilename(filePath),
          taskId: getTaskIdFromProblemId(getProblemIdFromFilename(filePath))
        };

        const cacheKey = `submission_${className}_${filename}`;
        await window.api.cacheWrite(sid, cacheKey, JSON.stringify(submissionData));
        
        // 更新提交索引
        await saveSubmissionIndex(filename);
        
        log.info('Saved submission result to cache', { filename, cacheKey });
      } catch (e) {
        log.warn('Failed to save submission result', e);
      }
    }

    // 从本地缓存读取提交结果
    async function loadSubmissionResult(filePath) {
      try {
        const filename = getPathBasename(filePath);
        if (!filename) return null;

        const cacheKey = `submission_${className}_${filename}`;
        const cached = await window.api.cacheRead(sid, cacheKey);
        
        if (cached) {
          const data = JSON.parse(cached);
          log.info('Loaded submission result from cache', { filename, cacheKey });
          return data;
        }
        
        return null;
      } catch (e) {
        log.warn('Failed to load submission result', e);
        return null;
      }
    }

    // 显示缓存的提交结果
    async function showCachedSubmissionResult(filePath) {
      try {
        const cachedData = await loadSubmissionResult(filePath);
        if (!cachedData || !cachedData.result) {
          log.debug('No cached submission result found', { filePath });
          return;
        }

        const result = cachedData.result;
        const gradePayload = (result && (result.grading_result || result.grading)) || result;

        // 如果存在评测结果，则显示
        if (typeof hasRenderableGradePayload === 'function' && hasRenderableGradePayload(gradePayload)) {
          log.info('Showing cached submission result', { filePath });
          
          // 显示输出区域
          if (typeof showOutput === 'function') showOutput('grade');
          
          // 渲染评测结果
          if (typeof renderGradeResult === 'function') renderGradeResult(gradePayload, filePath);
          
          statusEl.textContent = '已加载历史提交结果';
        } else {
          log.debug('Cached result has no grade payload', { filePath });
        }
      } catch (e) {
        log.warn('Failed to show cached submission result', e);
      }
    }

    function markFileAsSubmitted(filePath) {

      const basename = getPathBasename(filePath);

      if (!basename) return;

      pendingSubmittedFiles.add(basename);

      submittedFiles = Array.from(new Set([...submittedFiles, basename, `${sid}_${basename}`]));

      // 更新下载已提交按钮状态
      updateDownloadSubmittedButtonState();

    }

    function isFileSubmitted(filename) {

      const target = normalizeSubmittedFilename(filename);

      if (!target) return false;

      // 检查文件名是否?submittedFiles 中的任何一个匹?      // 1. 直接匹配（完全相同的文件名）

      if (submittedFiles.some((submittedFile) => normalizeSubmittedFilename(submittedFile) === target)) {

        return true;

      }



      // 2. 检?submittedFiles 中是否有带学号前缀的同名文?      //    例如：本地文?hwc101.py 匹配后端返回?202226010_hwc101.py

      return pendingSubmittedFiles.has(target);

    }



    // 初始化入口
    async function init() {

      try {

        statusEl.textContent = '正在初始化...';

        log.info('Initializing homework workspace', { sid, className });

        extractedDir = await window.api.getExtractedDir(sid, className);
        log.info('Got extractedDir', { extractedDir });

        currentDir = extractedDir;

        // 功能1: 检查本地是否有作业文件夹
        const needDownload = await shouldDownload(extractedDir);
        log.info('Checked if download needed', { extractedDir, needDownload });

        if (needDownload) {
          // 没有本地文件夹，需要下载
          log.info('No extracted homework found, triggering download');
          statusEl.textContent = '正在备份已修改文件...';

          // 备份已修改的文件
          try { await window.api.backupModifiedFiles(extractedDir); } catch (e) { log.warn('备份失败，跳过', e); }

          statusEl.textContent = '正在下载和解压作业包...';

          await downloadAndExtractHomework().catch(err => {

    // 发送本地文件列表到服务端
    async function sendLocalFileListToServer(dirPath) {
      try {
        const result = await window.api.listFiles(dirPath);
        
        if (!result.ok || !Array.isArray(result.files)) {
          log.warn('Failed to list local files', { error: result.error });
          return;
        }

        // 构建文件列表信息
        const fileList = result.files.map(file => ({
          name: file.name,
          path: file.path,
          isDirectory: file.isDirectory,
          size: file.size || 0
        }));

        // 发送到服务端（如果服务端有这个API）
        if (window.api.syncFileList) {
          const syncResult = await window.api.syncFileList(sid, className, fileList);
          log.info('Synced file list to server', { 
            fileCount: fileList.length,
            success: syncResult?.ok 
          });
        } else {
          log.info('syncFileList API not available, skipping server sync');
        }
      } catch (e) {
        log.error('Error sending file list to server', e);
        throw e;
      }
    }

    // 判断是否需要下载（目录不存在或为空）
    async function shouldDownload(dir) {

      try {

        const res = await window.api.listFiles(dir);

        if (!res.ok) {

          log.warn('listFiles failed while deciding download', { dir, error: res.error });

          return true;

        }

        const empty = res.files.length === 0;

        // 如果目录不为空，进一步检查是否包含有效的作业文件
        if (!empty) {
          // 检查是否有常见的作业文件类型
          const hasValidFiles = res.files.some(file => {
            const ext = getFileExtension(file.name).toLowerCase();
            // 检查是否是编程文件、文档或其他作业相关文件
            return ['.py', '.cpp', '.c', '.java', '.js', '.md', '.pdf', '.docx', '.txt', '.r'].includes(ext);
          });

          if (hasValidFiles) {
            log.info('Found valid homework files in extracted directory', { 
              dir, 
              fileCount: res.files.length,
              sampleFiles: res.files.slice(0, 3).map(f => f.name)
            });
            return false; // 有有效文件，不需要下载
          } else {
            log.warn('Directory exists but contains no valid homework files', { 
              dir, 
              files: res.files.map(f => f.name)
            });
            return true; // 目录存在但没有有效文件，需要重新下载
          }
        }

        log.debug('Checked extracted directory', { dir, empty, fileCount: res.files.length, files: res.files.map(f => f.name).slice(0, 5) });

        return empty;

      } catch (err) {

        log.warn('Failed to inspect extracted directory', { dir, error: err });

        return true;

      }

    }

    // 检查作业 deadline，更新提交按钮状态
    async function checkDeadline() {
      try {
        const baseUrl = await window.api.getBaseUrl();
        const url = `${String(baseUrl).replace(/\/+$/, '')}/api/assignment_deadline?course_name=${encodeURIComponent(className)}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.success && data.data) {
          const tasks = data.data.tasks || [];
          if (tasks.length > 0 && tasks[0].deadline) {
            const deadline = new Date(tasks[0].deadline);
            const now = new Date();
            const deadlineEl = document.createElement('div');
            deadlineEl.style.cssText = 'padding: 10px 16px; margin: 12px 0; background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; font-size: 13px; color: #92400e;';
            deadlineEl.textContent = '📅 作业截止时间：' + deadline.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

            if (now > deadline) {
              deadlineEl.style.background = '#fee2e2';
              deadlineEl.style.borderColor = '#f87171';
              deadlineEl.style.color = '#991b1b';
              deadlineEl.textContent = '⏰ 已过截止时间 (' + deadline.toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }) + ')，无法提交作业';
              submitBtn.disabled = true;
              submitBtn.title = '已过截止时间，无法提交';
            }

            const statusInfo = document.querySelector('.hw-header') || document.querySelector('.page');
            if (statusInfo) statusInfo.insertBefore(deadlineEl, statusInfo.firstChild);
          }
        }
      } catch (e) {
        log.warn('检查 deadline 失败，跳过', e);
      }
    }


    async function downloadAndExtractHomework() {

      log.info('Downloading homework package');

      statusEl.textContent = '正在下载作业包...';

      log.debug('Calling downloadHomeworkZip', { sid, className });

      const zipResult = await window.api.downloadHomeworkZip(sid, className);

      log.info('Download result', { ok: zipResult?.ok, file: zipResult?.file, error: zipResult?.error });

      if (!zipResult?.ok) {
        const errMsg = zipResult?.error || '下载作业包失败';
        log.error('Download failed', { error: errMsg });
        throw new Error(errMsg);
      }

      statusEl.textContent = '正在解压作业包...';

      log.debug('Calling unzipFile', { zipFile: zipResult.file, targetDir: extractedDir });

      const unzipResult = await window.api.unzipFile(zipResult.file, extractedDir);

      log.info('Unzip result', { ok: unzipResult?.ok, targetDir: unzipResult?.targetDir, error: unzipResult?.error });

      if (!unzipResult.ok) {
        const errMsg = unzipResult.error || '解压作业包失败';
        log.error('Unzip failed', { error: errMsg });
        throw new Error(errMsg);
      }

      statusEl.textContent = '解压完成';

      // 恢复已备份的文件
      try { await window.api.restoreModifiedFiles(extractedDir); } catch (e) { log.warn('恢复失败，跳过', e); }

      log.info('Homework包已解压', { extractedDir });

    }

    // 加载文件列表

    async function loadFileList(dirPath) {

      ensureFileListVisible();

      try {

        currentDir = dirPath;

        // 防御性修复：如果 currentFile 不在新目录中（或为空），重置编辑器和按钮状态。
        // 防止提交后 navigate 到不同文件夹时按钮状态不一致的 bug。
        const dirNormalized = dirPath.replace(/\/+$/, '');
        if (!currentFile || (!currentFile.startsWith(dirNormalized + '/') && currentFile !== dirNormalized)) {
          currentFile = null;
          if (editorWrapperEl) editorWrapperEl.style.display = 'none';
          explainBtn.disabled = true;
          runBtn.disabled = true;
          submitBtn.disabled = true;
          if (downloadSubmittedBtn) downloadSubmittedBtn.disabled = true;
          statusEl.textContent = '就绪';
        }

        log.debug('Starting loadFileList', { dirPath });

        const result = await window.api.listFiles(dirPath);

        log.debug('Listed directory', { dirPath, ok: result.ok, count: result.files && result.files.length });



        if (!result.ok) {

          fileListEl.innerHTML = `<div class="note">加载文件列表失败: ${result.error}</div>`;

          log.warn('加载文件列表失败', { dirPath, error: result.error });

          return;

        }




        fileListEl.innerHTML = '';

        if (!Array.isArray(result.files) || result.files.length === 0) {
          log.warn('File list is empty', { dirPath, isArray: Array.isArray(result.files), length: result.files?.length });
          log.debug('Directory check', { dirPath, dirExists: true, isEmpty: true });
          fileListEl.innerHTML = '<div class="empty-state">暂无文件</div>';
          return;
        }

        log.info('File list loaded', { dirPath, fileCount: result.files.length, files: result.files.map(f => ({ name: f.name, isDir: f.isDirectory })) });




        // 如果不是根目录，添加返回上级按钮

        if (dirPath !== extractedDir) {

          const parentItem = document.createElement('div');

          parentItem.className = 'file-item';
          parentItem.setAttribute('role', 'option');
          parentItem.setAttribute('aria-selected', 'false');
          parentItem.setAttribute('tabindex', '0');
          parentItem.setAttribute('aria-label', '返回上级目录');

          parentItem.innerHTML = '<div class="file-icon" aria-hidden="true">📁</div><span>..</span>';

          parentItem.onclick = () => loadFileList(getPathDirname(dirPath));
          parentItem.onkeydown = (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              parentItem.click();
            }
          };

          fileListEl.appendChild(parentItem);

        }



        // 按文件夹在前、文件在后排序
        const sortedFiles = [...result.files].sort((a, b) => {

          if (a.isDirectory && !b.isDirectory) return -1;

          if (!a.isDirectory && b.isDirectory) return 1;

          return a.name.localeCompare(b.name);

        });



        // 添加文件和文件夹

        sortedFiles.forEach(file => {

          const item = document.createElement('div');

          item.className = 'file-item';



          if (file.isDirectory) {

            item.innerHTML = `<div class="file-icon" aria-hidden="true">📁</div><span>${file.name}</span>`;
            item.setAttribute('aria-label', `文件夹：${file.name}`);
            item.setAttribute('role', 'option');
            item.setAttribute('tabindex', '0');
            item.setAttribute('aria-selected', 'false');

            item.onclick = () => loadFileList(file.path);
            item.onkeydown = (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                item.click();
              }
            };

          } else {

            // 对于 .md .pdf .docx 文件，不显示作业状态
            const ext = getFileExtension(file.name).toLowerCase();

            const noStatusExts = ['.md', '.pdf', '.docx'];

            const shouldShowStatus = !noStatusExts.includes(ext);



            let statusHtml = '';

            let statusAriaLabel = '';

            if (shouldShowStatus) {

              const isSubmitted = isFileSubmitted(file.name);

              const statusClass = isSubmitted ? 'status-submitted' : 'status-pending';

              const statusText = isSubmitted ? '已提交' : '未提交';
              statusAriaLabel = `，状态：${statusText}`;

              statusHtml = `<span class="homework-status ${statusClass}" aria-label="${statusText}">${statusText}</span>`;

            }

            // 在文件名右侧显示作业状态
            item.innerHTML = `

              <div class="file-info">

                <div class="file-icon" aria-hidden="true">${getFileIcon(file.name)}</div>

                <span>${file.name}</span>

                ${statusHtml}

              </div>

            `;
            item.setAttribute('aria-label', `文件：${file.name}${statusAriaLabel}`);
            item.setAttribute('role', 'option');
            item.setAttribute('tabindex', '0');
            item.setAttribute('aria-selected', currentFile === file.path ? 'true' : 'false');

            item.onclick = () => openFile(file.path);
            item.onkeydown = (e) => {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                item.click();
              }
            };

            // 高亮当前选中的文件
            if (currentFile === file.path) {

              item.classList.add('active');
              item.setAttribute('aria-selected', 'true');

            }

          }



          fileListEl.appendChild(item);

        });

        log.debug('File list rendering completed', { fileCount: sortedFiles.length });

      } catch (error) {

        log.error('加载文件列表失败', error);

        fileListEl.innerHTML = `<div class="note">加载文件列表失败: ${error.message}</div>`;

      } finally {

        ensureFileListVisible();

      }

    }

    // 运行Python文件

    async function runPythonFile() {

      // OS 识别

      function getOS() {

        const ua = navigator.userAgent || '';

        if (/Windows/i.test(ua)) return 'windows';

        if (/Macintosh|Mac OS X/i.test(ua)) return 'mac';

        if (/Linux/i.test(ua)) return 'linux';

        return 'other';

      }

      function isPythonMissing(raw) {

        if (!raw) return false;

        const s = String(raw).toLowerCase();

        return s.includes('not recognized') ||
               s.includes('python: not found') ||
               (s.includes('no such file') && s.includes('python')) ||
               s.includes('未找到 python') ||
               s.includes('no pyvenv.cfg file');

      }

      function showPythonMessage(msg) {

        showOutput('python');

        const outputContent = pythonOutputEl.querySelector('.output-content');

        outputContent.textContent = msg;   // 仅在输出区域显示

      }

      // 针对 Windows 用户的 PATH 提示（专门用于输出区域）
      function getWindowsPathFixHint() {
        return [
          '程序运行失败：未找到 Python 或 Python 配置有误。',
          '',
          '常见原因：',
          '1. Python 未安装',
          '2. Python 未添加到系统 PATH',
          '3. 虚拟环境配置损坏（pyvenv.cfg 文件缺失）',
          '',
          '解决方法：',
          '',
          '方法一：重新安装 Python（推荐）',
          '1. 从 python.org 下载 Python 3.8 或更高版本',
          '2. 安装时务必勾选 “Add Python to PATH” 选项',
          '3. 安装完成后重启本应用',
          '',
          '方法二：手动添加 Python 到 PATH',
          '1. 找到 Python 安装目录（例如：C:\\Python311）',
          '2. 打开”系统环境变量”设置',
          '3. 在 PATH 中添加 Python 目录和 Scripts 目录',
          '4. 重启本应用',
          '',
          '方法三：使用 PowerShell 自动修复（需要已安装 Python）',
          '1. 打开 PowerShell',
          '2. 执行命令：',
          '   setx PATH “$($env:PATH);$(dirname (Get-Command python).Source);$(dirname (Get-Command python).Source)\\Scripts”',
          '3. 重启本应用'
        ].join('\n');
      }

      function getPythonMissingHint(raw, os) {
        const detail = String(raw || '').trim();
        if (detail && (detail.includes('最近尝试:') || detail.includes('未找到 Python 解释器'))) {
          return detail;
        }

        if (os === 'windows') {
          return getWindowsPathFixHint();
        }

        if (os === 'mac') {
          return '未找到 Python 安装位置。\n请在终端执行: brew install python 或安装官方包，并确保能在终端中运行 python3';
        }

        return '未找到 Python 安装位置。\n请确保已安装 Python 并可在终端中运行 python 或 python3';
      }



      clearOutputs('run');



      if (!currentFile) {

        showPythonMessage('请先打开一个文件');

        statusEl.textContent = '未选择文件';

        return;

      }

      const ext = getFileExtension(currentFile);

      if (ext !== '.py') {

        showPythonMessage('只能运行 Python 文件 (.py)');

        statusEl.textContent = '文件类型不支持';

        return;

      }



      try {

        statusEl.textContent = '正在运行Python文件...';

        log.info('Running python file', { file: currentFile });

        await saveFile();



        // 准备输出区域（清空后再显示）

        showOutput('python');

        const outputContent = pythonOutputEl.querySelector('.output-content');

        outputContent.textContent = '正在运行...\n';



        const fileDir = getPathDirname(currentFile);

        const cleanup = window.api.onPythonLive((data) => {

          log.trace('Python live chunk received');

          outputContent.textContent += data;

          outputContent.scrollTop = outputContent.scrollHeight;

        });



        let result;

        try {

          result = await window.api.runPython(fileDir, currentFile);

          log.info('Python execution finished', { ok: result.ok, code: result.code });

        } catch (err) {

          const os = getOS();

          const rawMsg = err?.message;

          if (isPythonMissing(rawMsg)) {
            showPythonMessage(getPythonMissingHint(rawMsg, os));
            statusEl.textContent = os === 'windows' ? '已检测到缺少 Python 或未加入 PATH' : '缺少 Python';

          } else {

            showPythonMessage('运行异常: ' + (err.message || '未知错误'));

            statusEl.textContent = '运行异常';

          }

          cleanup();

          return;

        }



        if (result.ok) {

          outputContent.textContent += `\n\n程序已完成运行，退出码: ${result.code}`;

          statusEl.textContent = '运行完成';

        } else {

          const raw = result.output || '';

          const os = getOS();

          if (isPythonMissing(raw)) {
            showPythonMessage(getPythonMissingHint(raw, os));
            statusEl.textContent = os === 'windows' ? '已检测到缺少 Python 或未加入 PATH' : '缺少 Python';

          } else {

            outputContent.textContent += `\n\n程序运行失败: ${raw || '未知错误'}`;

            statusEl.textContent = '运行失败';

            log.warn('Python脚本运行失败', { file: currentFile, output: raw });

          }

        }

        cleanup();

      } catch (error) {

        const raw = error?.message || '';

        const os = getOS();

        if (isPythonMissing(raw)) {
          showPythonMessage(getPythonMissingHint(raw, os));
          statusEl.textContent = os === 'windows' ? '已检测到缺少 Python 或未加入 PATH' : '缺少 Python';

        } else {

          showPythonMessage('运行失败: ' + (error.message || '未知错误'));

          statusEl.textContent = '运行失败';

          log.error('运行Python脚本异常', error);

        }

      }

    }



    // 创建/获取“评测输出”区域（使用与 python 输出一致的容器样式）
    function ensureGradeOutputArea() {

    function getProblemIdFromFilename(filename) {

      const base = getPathBasename(filename);

      // 题目ID是文件名前缀，以下划线分割：hwc102_2023xxxx.py -> hwc102

      const idx = base.indexOf('_');

      return idx > 0 ? base.slice(0, idx) : base.replace(/\.[^.]+$/, '');

    }

    function getTaskIdFromProblemId(problemId) {

      const text = String(problemId || '').trim();

      const match = text.match(/\d+/);

      if (!match) return undefined;

      const value = parseInt(match[0], 10);

      return Number.isFinite(value) ? value : undefined;

    }



    function renderGradeResult(json, filename) {

      const content = ensureGradeOutputArea();



      try {

        const detail = Array.isArray(json?.detail)
          ? json.detail
          : Array.isArray(json?.test_cases)
            ? json.test_cases
            : Array.isArray(json?.table)
              ? json.table
              : [];

        const totalScore = json?.score ?? json?.total_score;

        const fullScore = json?.score_full;

        const passed = json?.pass ?? json?.passed;

        const problemId = json?.problem_id || getProblemIdFromFilename(filename);
        const status = json?.status || '';
        const attempted = json?.attempted;
        const passedCount = json?.passed_count;
        const totalCount = json?.total_count ?? json?.total_cases ?? detail.length;
        const message = json?.message || json?.msg || '';



        const rows = detail.map(item => {

          const args = Array.isArray(item?.args) ? item.args : [];

          const kwargs = item?.kwargs && typeof item.kwargs === 'object' ? item.kwargs : {};

          const inputParts = [];

          if (args.length) inputParts.push(...args.map(v => JSON.stringify(v)));

          for (const k of Object.keys(kwargs)) {

            inputParts.push(`${k}=${JSON.stringify(kwargs[k])}`);

          }

          const inputText = item?.input !== undefined ? JSON.stringify(item.input) : inputParts.join(', ');

          const expected = item?.expected?.value !== undefined
            ? item.expected.value
            : (item?.expected ?? item?.expected_output);

          const actual = item?.output ?? item?.actual ?? item?.actual_output;

          const ok = item?.ok ?? item?.passed ?? false;

          const score = item?.score_full !== undefined && item?.score !== undefined
            ? `${item.score}/${item.score_full}`
            : (item?.score ?? '');

          const dur = item?.duration_ms ?? '';
          // 截断超长字符串（超过 300 字符），防止撑开布局
          const truncateStr = (s, max = 300) =>
            typeof s === 'string' && s.length > max ? s.slice(0, max) + '... (已截断)' : s;

          const outputText = [
            actual !== undefined ? truncateStr(JSON.stringify(actual)) : '',
            item?.stdout ? truncateStr(`stdout: ${item.stdout}`) : '',
            item?.error ? truncateStr(`error: ${item.error}`) : ''
          ].filter(Boolean).join('\n');

	          const formatVal = v => v !== undefined && v !== null
                ? truncateStr(JSON.stringify(v, null, 2))
                : "";

          return `

            <tr>

              <td style="white-space:pre-wrap;word-break:break-word">${inputText}</td>

              <td style="white-space:pre-wrap;word-break:break-word">${outputText}</td>

              <td style="white-space:pre-wrap;word-break:break-word">${expected !== undefined ? formatVal(expected) : ''}</td>

              <td style="color:${ok ? '#2e7d32' : '#e53935'}">${ok ? '通过' : '未通过'}</td>

              <td>${score}</td>

              <td>${dur}</td>

            </tr>`;

        }).join('');



        const scoreText =
          totalScore !== undefined || fullScore !== undefined
            ? `${totalScore ?? '-'} / ${fullScore ?? '-'}`
            : '-';

        const caseText =
          passedCount !== undefined || totalCount !== undefined
            ? `${passedCount ?? '-'} / ${totalCount ?? '-'}`
            : '-';

        const resultText =
          passed === undefined
            ? (status || '未返回结果')
            : (passed ? '通过' : '未通过');

        const summary = `

            <div class="grade-summary">

            题目: ${problemId} | 总分: ${scoreText} | 用例: ${caseText} | 结果:

            <b style="color:${passed ? '#2e7d32' : '#e53935'}">

              ${resultText}

            </b>

            ${status ? ` | 状态: ${status}` : ''}
            ${attempted !== undefined ? ` | 已判分: ${attempted ? '是' : '否'}` : ''}
            ${message ? `<div class="note" style="margin-top:8px;">${message}</div>` : ''}

            </div>`;



        const table = `

          <table class=\"grade-table\">\n            <thead>\n              <tr>\n                <th>输入案例</th>\n                <th>你的输出</th>\n                <th>期望输出</th>\n                <th>是否通过</th>\n                <th>得分</th>\n                <th>耗时(ms)</th>\n              </tr>\n            </thead>\n            <tbody>\n              ${rows || ''}\n            </tbody>\n          </table>`;



        content.innerHTML = summary + table;

      } catch (e) {

        log.error('渲染评测结果失败', e);

        content.innerHTML = `<div class=\"note\">渲染评测结果失败: ${e.message}</div>`;

      }

    }



    async function gradeCurrentFile(filePath) {

      try {

        const filename = getPathBasename(filePath);
        const problemId = getProblemIdFromFilename(filePath);
        const taskId = getTaskIdFromProblemId(problemId);

        statusEl.textContent = '正在调用评测接口...';

        log.info('Calling autograde API', { file: filePath, problemId, taskId });

        const result = await window.api.autogradeHomework({
          studentId: sid,
          className,
          taskId,
          problemId,
          filePath,
          withFeedback: false
        });

        const gradePayload = (result && (result.grading_result || result.grading)) || result;
        const hasGradePayload = !!(
          gradePayload &&
          (Array.isArray(gradePayload.detail) ||
            Array.isArray(gradePayload.test_cases) ||
            Array.isArray(gradePayload.table) ||
            gradePayload.score !== undefined ||
            gradePayload.total_score !== undefined)
        );

        if (result && result.success === false && !hasGradePayload) {
          throw new Error(result?.msg || '评测失败');
        }

        renderGradeResult(gradePayload, filename);

        statusEl.textContent = result && result.success === false ? '评测失败' : '评测完成';

      } catch (e) {

        log.error('调用评测接口异常', e);

        const content = ensureGradeOutputArea();

        content.innerHTML = `<div class=\"note\">评测异常: ${e.message}</div>`;

        statusEl.textContent = '评测异常';

      }

    }

          Array.isArray(payload.test_cases) ||
          Array.isArray(payload.table) ||
          payload.score !== undefined ||
          payload.total_score !== undefined)
      );

    }

    // 新增：文件列表区域拖拽上�?pdf/docx

    function setupDragAndDropUpload() {

      if (!fileBrowserEl) return;



      const highlight = () => fileBrowserEl.classList.add('drag-over');

      const unhighlight = () => fileBrowserEl.classList.remove('drag-over');



      ['dragenter', 'dragover'].forEach(eventName => {

        fileBrowserEl.addEventListener(eventName, (e) => {

          e.preventDefault();

          e.stopPropagation();

          highlight();

        });

      });



      ['dragleave', 'drop'].forEach(eventName => {

        fileBrowserEl.addEventListener(eventName, (e) => {

          e.preventDefault();

          e.stopPropagation();

          if (eventName === 'dragleave' && e.target !== fileBrowserEl) return;

          unhighlight();

        });

      });



      fileBrowserEl.addEventListener('drop', async (e) => {

        e.preventDefault();

        e.stopPropagation();

        unhighlight();



        const dt = e.dataTransfer;

        if (!dt || !dt.files || dt.files.length === 0) return;



        const files = Array.from(dt.files);

        log.info('检测到拖拽上传', { total: files.length });

        const allowed = files.filter(f => {

          const ext = getFileExtension(f.name);

          return ['.pdf', '.docx', '.py', '.java', '.cpp', '.md'].includes(ext);

        });



        if (allowed.length === 0) {

          log.warn('拖拽文件类型不支持');

          showOutput('grade');

          const out = gradeOutputEl.querySelector('.output-content');

          out.className = 'output-content upload-result-content';

          out.textContent =
            '❌ 不支持的文件类型\n\n' +
            '仅支持上传以下文件类型：.py, .java, .cpp, .md, .pdf, .docx\n' +
            '请拖拽支持的文件到左侧文件列表区域。';

          statusEl.textContent = '不支持的文件类型';

          return;

        }



        // 支持批量上传，逐个处理
        // 先初始化输出区域
        showOutput('grade');
        const outputContent = gradeOutputEl.querySelector('.output-content');
        outputContent.className = 'output-content upload-result-content';
        outputContent.textContent = `📤 开始批量上传 (共 ${allowed.length} 个文件)\n\n`;

        for (const f of allowed) {

          try {

            statusEl.textContent = '正在上传作业附件...';

            // 追加显示上传进度（而不是覆盖）

            outputContent.textContent += `⏳ 正在上传：${f.name}...\n`;

            log.info('开始上传附件', { name: f.name, size: f.size, index: allowed.indexOf(f) + 1, total: allowed.length });



            // 构建 FormData 上传

            const formData = new FormData();

            formData.append('student_id', sid);

            formData.append('class_name', className);

            formData.append('file_type', 'attachment');

            formData.append('file', f);



            // 调用 lab.uibe.edu.cn 的上传接口

            const base = (await window.api.getBaseUrl()) || 'https://lab.uibe.edu.cn';
            const uploadUrl = `${String(base).replace(/\/+$/, '')}/api/uploadHomeworkTest`;

            const res = await fetch(uploadUrl, {

              method: 'POST',

              body: formData,

              credentials: 'include' // 携带cookie

            });



            if (!res.ok) {

              throw new Error(`HTTP ${res.status}: ${res.statusText}`);

            }



            const data = await res.json();

            log.info('附件上传完成', { success: data && data.success });



            if (data && data.success) {

              // 成功：追加显示成功提示

              outputContent.textContent += `✅ ${f.name} 上传成功\n`;

              outputContent.classList.add('success');

              statusEl.textContent = '正在上传...';

            } else {

              // 失败：追加显示错误信息

              const errorMsg = ((data && (data.message || data.msg)) || '未知错误');

              outputContent.textContent += `❌ ${f.name} 上传失败：${errorMsg}\n`;

              outputContent.classList.remove('success');

              statusEl.textContent = '部分文件上传失败';

              log.warn('附件上传失败', { response: data });

            }

          } catch (err) {

            // 异常：追加显示异常信息
            const exceptionMsg = (err.message || err);

            outputContent.textContent += `❌ ${f.name} 上传异常：${exceptionMsg}\n`;

            outputContent.className = 'output-content upload-result-content';

            outputContent.classList.remove('success');

            statusEl.textContent = '部分文件上传失败';

            log.error('附件上传异常', err);

          }
        }

        // 所有文件上传完毕
        outputContent.textContent += `\n✨ 批量上传完成！`;
        statusEl.textContent = '批量上传完成';

        // 将上传的文件动态添加到文件列表中（不是刷新整个列表）
        try {
          for (const f of allowed) {
            const existingItem = Array.from(fileListEl.querySelectorAll('.file-item')).find(el => {
              const text = el.textContent || '';
              return text.includes(f.name);
            });
            if (!existingItem) {
              const item = document.createElement('div');
              item.className = 'file-item';
              const ext = getFileExtension(f.name).toLowerCase();
              const noStatusExts = ['.md', '.pdf', '.docx'];
              const shouldShowStatus = !noStatusExts.includes(ext);

              let statusHtml = '';
              if (shouldShowStatus) {
                statusHtml = `<span class="homework-status status-pending">未提交</span>`;
              }
              item.innerHTML = `
                <div class="file-info">
                  <div class="file-icon">${getFileIcon(f.name)}</div>
                  ${f.name}
                  ${statusHtml}
                </div>
              `;
              item.onclick = () => openFile(currentDir + '\\' + f.name);
              fileListEl.appendChild(item);
              log.debug('Added uploaded file to list', { name: f.name });
            }
          }
        } catch (e) {
          log.warn('添加上传文件到列表失败', e);
        }

      });

    }



    // 事件监听

    // 提取文件的题号（如 hwc120.py -> hwc120）

    function extractQuestionId(filePath) {

      if (!filePath) return '';

      const filename = getPathBasename(filePath);
      
      // 去掉扩展名和学号前缀

      let questionId = filename.replace(/^\d+_/, ''); // 去掉学号前缀
      questionId = questionId.replace(/\.[^.]+$/, ''); // 去掉扩展名
      return questionId;
    }

    // 更新"下载已提交"按钮状态（只要有已提交的文件就启用）
    function updateDownloadSubmittedButtonState() {
      if (!downloadSubmittedBtn) return;

      // submittedFiles 中有已提交的文件时启用按钮
      const hasSubmitted = submittedFiles && submittedFiles.length > 0;
      downloadSubmittedBtn.disabled = !hasSubmitted;
    }

    // 批量下载所有已提交的作业内容并覆盖本地文件
    async function downloadSubmittedContent() {
      try {
        statusEl.textContent = '正在批量下载已提交内容...';
        downloadSubmittedBtn.disabled = true;

        log.info('Batch downloading all submitted files', { studentId: sid, className, submittedCount: submittedFiles.length });

        const base = (await window.api.getBaseUrl()) || 'https://lab.uibe.edu.cn';
        const url = `${String(base).replace(/\/+$/, '')}/api/student/batch_download_submissions`;

        const formData = new FormData();
        formData.append('student_id', sid);
        formData.append('class_name', className);

        const res = await fetch(url, {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });

        const data = await res.json();

        if (!data || !data.success) {
          throw new Error(data?.detail || data?.message || '批量下载失败');
        }

        const files = data.files || [];

        if (files.length === 0) {
          statusEl.textContent = '没有已提交的文件可下载';
          showOutput('grade');
          const gradeContent = gradeOutputEl.querySelector('.output-content');
          gradeContent.innerHTML = `<div style="color:#f57c00;font-size:16px;padding:12px;">⚠️ 没有找到已提交的文件</div>`;
          return;
        }

        // 批量下载每个文件并覆盖本地
        let successCount = 0;
        let failCount = 0;
        const failDetails = [];

        for (const file of files) {
          try {
            // 在 extractedDir 中递归查找匹配的本地文件
            const searchResult = await window.api.findFileInDir(extractedDir, file.file_name);
            let targetPath = '';

            if (searchResult.ok && searchResult.path) {
              targetPath = searchResult.path;
            } else {
              // 未找到匹配文件，放到 extractedDir 根目录
              targetPath = extractedDir.replace(/\/+$/, '') + '/' + file.file_name;
            }

            // 写入本地文件
            const writeEncoding = file.encoding === 'base64' ? 'base64' : 'utf-8';
            const writeResult = await window.api.writeFile(targetPath, file.content, writeEncoding);

            if (writeResult.ok) {
              successCount++;
              log.info('Downloaded submitted file', { file: file.file_name, target: targetPath });
            } else {
              failCount++;
              failDetails.push(file.file_name);
              log.warn('写入本地文件失败', { file: file.file_name, error: writeResult.error });
            }
          } catch (fileError) {
            failCount++;
            failDetails.push(file.file_name);
            log.error('下载文件失败', { file: file.file_name, error: fileError });
          }
        }

        // 刷新文件列表
        await loadFileList(currentDir || extractedDir);

        // 如果当前有打开的文件，重新加载编辑器内容
        if (currentFile) {
          try {
            const content = await window.api.readFile(currentFile, 'utf-8');
            if (content) {
              const extName = getFileExtension(currentFile).replace('.', '').toLowerCase();
              const langMap = {
                py: 'python', md: 'markdown', js: 'javascript', json: 'json',
                html: 'html', css: 'css', java: 'java', c: 'c', cpp: 'cpp'
              };
              await setEditorValue(content, langMap[extName] || 'plaintext');
            }
          } catch (e) {
            log.warn('重新加载编辑器内容失败', e);
          }
        }

        // 显示结果
        const totalMsg = `成功: ${successCount} 个文件` + (failCount > 0 ? `, 失败: ${failCount} 个文件` : '');
        statusEl.textContent = totalMsg;

        showOutput('grade');
        const gradeContent = gradeOutputEl.querySelector('.output-content');
        if (failCount === 0) {
          gradeContent.innerHTML = `<div style="color:#2e7d32;font-size:16px;padding:12px;">✅ 批量下载完成，已覆盖 ${successCount} 个本地文件</div>`;
        } else {
          gradeContent.innerHTML = `<div style="color:#e53935;font-size:16px;padding:12px;">⚠️ 批量下载完成: ${successCount} 成功, ${failCount} 失败<br>失败文件: ${failDetails.join(', ')}</div>`;
        }

      } catch (error) {
        log.error('批量下载已提交内容失败', error);
        statusEl.textContent = '下载失败';
        showOutput('grade');
        const gradeContent = gradeOutputEl.querySelector('.output-content');
        gradeContent.innerHTML = `<div style="color:#e53935;font-size:16px;padding:12px;">❌ 下载失败: ${error.message}</div>`;
      } finally {
        updateDownloadSubmittedButtonState();
      }
    }

    // 更新讲解按钮是否可点击（增强匹配：支持多种文件名格式）
    function updateExplanationButtonState() {
      if (!explainBtn) return;

      // 如果没有打开文件或视频列表为空，禁用按钮
      if (!currentFile || !videoFiles || videoFiles.length === 0) {
        explainBtn.disabled = true;
        return;
      }

      // 提取当前文件的题号（如 hwc120）
      const currentQuestionId = (extractQuestionId(currentFile) || '').toLowerCase();
      if (!currentQuestionId) {
        explainBtn.disabled = true;
        return;
      }

      // 更灵活的匹配规则：
      // 1. 直接等于（去掉扩展名）
      // 2. 文件名包含题号（例如 hwc120 - 讲解.mp4、202206070_hwc120.mp4）
      // 3. 文件名以题号结尾（例如 something_hwc120.mp4）
      let matchedVideo = null;
      let matchDetails = [];
      const hasVideo = videoFiles.some((videoFile) => {
        if (!videoFile) return false;
        const name = String(videoFile).replace(/\.(mp4|MP4)$/, '').toLowerCase();

        // 记录每个视频的匹配尝试
        const match1 = name === currentQuestionId;
        const match2 = name.includes(currentQuestionId);
        const match3 = name.endsWith(currentQuestionId);
        const tokens = name.split(/[_\-\s]/).filter(Boolean);
        const match4 = tokens.includes(currentQuestionId);

        // 只记录前10个视频的匹配详情，避免日志过多
        if (matchDetails.length < 10) {
          matchDetails.push({
            video: videoFile,
            name,
            match1,
            match2,
            match3,
            match4
          });
        }

        if (match1 || match2 || match3 || match4) {
          matchedVideo = videoFile;
          return true;
        }
        return false;
      });

      explainBtn.disabled = !hasVideo;
    }

          <script>
            (function() {
        const video = document.getElementById('player');
        const playBtn = document.getElementById('playPauseBtn');
        const progress = document.getElementById('progress');
        const timeCurrent = document.getElementById('timeCurrent');
        const timeDuration = document.getElementById('timeDuration');
        const speedButtons = Array.prototype.slice.call(document.querySelectorAll('.speed'));

        // 设置视频源
        video.src = "${safeUrl}";

        function formatTime(sec) {
          if (!isFinite(sec)) return '00:00';
          const s = Math.floor(sec % 60).toString().padStart(2, '0');
          const m = Math.floor(sec / 60).toString().padStart(2, '0');
          return m + ':' + s;
        }

        function updatePlayButton() {
          if (video.paused) {
            playBtn.textContent = '▶ 播放';
          } else {
            playBtn.textContent = '⏸ 暂停';

        }

        playBtn.addEventListener('click', function() {
          if (video.paused) {
            video.play();
          } else {
            video.pause();
          }
        });

        video.addEventListener('play', updatePlayButton);
        video.addEventListener('pause', updatePlayButton);

        video.addEventListener('loadedmetadata', function() {
          timeDuration.textContent = formatTime(video.duration || 0);
        });

        video.addEventListener('timeupdate', function() {
          timeCurrent.textContent = formatTime(video.currentTime || 0);
          if (video.duration) {
            const ratio = video.currentTime / video.duration;
            progress.value = Math.round(ratio * 1000);
          }
        });

        progress.addEventListener('input', function() {
          if (!video.duration) return;
          const ratio = progress.value / 1000;
          video.currentTime = ratio * video.duration;
        });

        // 倍速控制
        function setRate(rate) {
          video.playbackRate = rate;
          speedButtons.forEach(function(btn) {
            const r = parseFloat(btn.getAttribute('data-rate') || '1');
            btn.classList.toggle('active', r === rate);
          });

    // 拖动分隔线调整高度（保持输出区底部与左侧文件列表底部对齐，分隔线始终可见）
    (function setupResizer() {

      if (!resizeHandleEl) return;

      const container = document.querySelector('.editor-container');
      const editorPane = document.querySelector('.editor-pane');
      const outputPane = document.getElementById('outputPane');

      if (!container || !editorPane || !outputPane) return;

      const HANDLE_HEIGHT = 10;  // 与 .resize-handle 高度一致
      const GAP_SIZE = 14;       // grid gap
      const MIN_EDITOR = 120;    // 编辑区最小高度
      const MIN_OUTPUT = 120;    // 输出区最小高度




      let startY = 0;

      let startEditorHeight = 0;

      let totalHeight = 0;

      // 初始化布局：设置编辑区初始高度为容器的50%
      function initializeGridLayout() {
        const rect = container.getBoundingClientRect();
        const initialHeight = Math.max(MIN_EDITOR, (rect.height - HANDLE_HEIGHT - (2 * GAP_SIZE)) / 2);
        container.style.gridTemplateRows = `${initialHeight}px ${HANDLE_HEIGHT}px 1fr`;
      }



      function onMouseMove(e) {

        const dy = e.clientY - startY;

        let newEditor = startEditorHeight + dy;



        // 约束编辑区高�?        newEditor = Math.max(MIN_EDITOR, newEditor);



        // 计算最大允许高度：总高�?- handle - 2个gap - 最小输出区高度

        // 这样保证剩下的空�?(1fr) 至少�?MIN_OUTPUT 那么大，不会触发容器溢出

        const maxEditor = totalHeight - HANDLE_HEIGHT - (2 * GAP_SIZE) - MIN_OUTPUT;



        newEditor = Math.min(maxEditor, newEditor);

        // 更新 grid：上行使用像素高度，中间固定 10px，底部用 fr 填满剩余高度

        container.style.gridTemplateRows = `${newEditor}px ${HANDLE_HEIGHT}px 1fr`;

        // 刷新 CodeMirror 编辑器布局
        refreshEditorLayout();

      }



      function onMouseUp() {

        document.removeEventListener('mousemove', onMouseMove);

        document.removeEventListener('mouseup', onMouseUp);

        // 恢复 iframe/embed 鼠标事件

        document.querySelectorAll('embed, iframe').forEach(el => el.style.pointerEvents = 'auto');

        // 最后再刷新一次以确保编辑器布局正确
        refreshEditorLayout();

      }



      resizeHandleEl.addEventListener('mousedown', (e) => {

        e.preventDefault();

        // 拖动时禁用 embed/iframe 响应鼠标，防止拖动卡顿或丢失焦点

        document.querySelectorAll('embed, iframe').forEach(el => el.style.pointerEvents = 'none');

        // 使用整个容器的高度

        const rect = container.getBoundingClientRect();

        const editorRect = editorPane.getBoundingClientRect();



        totalHeight = rect.height;

        startEditorHeight = editorRect.height;

        startY = e.clientY;



        // 初始化一次成像素+fr 布局

        container.style.gridTemplateRows =

          `${startEditorHeight}px ${HANDLE_HEIGHT}px 1fr`;



        document.addEventListener('mousemove', onMouseMove);

        document.addEventListener('mouseup', onMouseUp);

      });

      // 初始化并在窗口大小改变时重新初始化
      setTimeout(() => {
        initializeGridLayout();
        refreshEditorLayout();
      }, 100);
      window.addEventListener('resize', () => {
        initializeGridLayout();
        refreshEditorLayout();
      });

    })();
