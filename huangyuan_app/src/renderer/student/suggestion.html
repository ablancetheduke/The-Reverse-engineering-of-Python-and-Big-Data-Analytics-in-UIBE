<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' http: https:;">
  <title>问题或建议</title>
  <link rel="icon" type="image/x-icon" href="../../image/tupian.ico">
  <link rel="stylesheet" href="./styles.css">
  <style>
    .page {
      max-width: 640px;
      margin: 0 auto;
      padding: 32px 20px;
      animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h2 {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      margin: 0 0 8px 0;
    }

    .header .subtitle {
      color: #64748b;
      font-size: 15px;
    }

    .form-card {
      background: #ffffff;
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      font-size: 15px;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .form-group textarea {
      width: 100%;
      min-height: 180px;
      padding: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 15px;
      line-height: 1.6;
      color: #0f172a;
      background: #f8fafc;
      resize: vertical;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
      box-sizing: border-box;
    }

    .form-group textarea:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
      background: #ffffff;
    }

    .form-group textarea::placeholder {
      color: #94a3b8;
    }

    .image-upload-area {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px;
      border: 2px dashed #cbd5e1;
      border-radius: 16px;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .image-upload-area:hover {
      border-color: #3b82f6;
      background: #eff6ff;
    }

    .image-upload-area .upload-icon {
      font-size: 32px;
      flex-shrink: 0;
    }

    .image-upload-area .upload-text {
      color: #64748b;
      font-size: 14px;
    }

    .image-upload-area .upload-text strong {
      color: #3b82f6;
    }

    .image-preview {
      display: none;
      margin-top: 12px;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.1);
    }

    .image-preview img {
      width: 100%;
      max-height: 300px;
      object-fit: contain;
      background: #f1f5f9;
      display: block;
    }

    .image-preview .remove-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease;
    }

    .image-preview .remove-btn:hover {
      background: rgba(0, 0, 0, 0.7);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      margin-top: 32px;
    }

    .btn-primary {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      transition: all 0.2s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .btn-secondary {
      padding: 14px 24px;
      border: 2px solid #e2e8f0;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      background: #ffffff;
      color: #64748b;
      transition: all 0.2s ease;
    }

    .btn-secondary:hover {
      border-color: #94a3b8;
      color: #0f172a;
    }

    .status-message {
      display: none;
      padding: 14px 18px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      margin-bottom: 20px;
      text-align: center;
    }

    .status-message.success {
      display: block;
      background: rgba(34, 197, 94, 0.1);
      color: #16a34a;
      border: 1px solid rgba(34, 197, 94, 0.2);
    }

    .status-message.error {
      display: block;
      background: rgba(239, 68, 68, 0.1);
      color: #dc2626;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .char-count {
      text-align: right;
      font-size: 13px;
      color: #94a3b8;
      margin-top: 6px;
    }

    .char-count.over {
      color: #ef4444;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s ease-in-out infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="header">
      <h2>💬 问题或建议</h2>
      <div class="subtitle">告诉我们你的想法，帮助我们做得更好</div>
    </div>

    <div class="form-card">
      <div id="statusMessage" class="status-message"></div>

      <div class="form-group">
        <label for="content">你想说什么？</label>
        <textarea id="content" placeholder="请详细描述你的问题或建议..." maxlength="2000"></textarea>
        <div class="char-count"><span id="charCount">0</span>/2000</div>
      </div>

      <div class="form-group">
        <label>添加图片（可选）</label>
        <div id="uploadArea" class="image-upload-area">
          <span class="upload-icon">📷</span>
          <span class="upload-text">点击选择图片，或拖拽图片到此处 <strong>（支持 JPG / PNG）</strong></span>
        </div>
        <input type="file" id="imageInput" accept="image/jpeg,image/png,image/jpg" style="display:none">
        <div id="imagePreview" class="image-preview">
          <img id="previewImg" src="" alt="预览">
          <button id="removeImageBtn" class="remove-btn">✕</button>
        </div>
      </div>

      <div class="btn-row">
        <button id="backBtn" class="btn-secondary" onclick="history.back()">返回</button>
        <button id="submitBtn" class="btn-primary" onclick="handleSubmit()">提交建议</button>
      </div>
    </div>
  </div>

  <script>
    const sid = sessionStorage.getItem('student_id') || localStorage.getItem('studentId') || '';
    if (!sid) location.replace('../login/index.html');

    // DOM 元素
    const contentTextarea = document.getElementById('content');
    const charCount = document.getElementById('charCount');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');
    const uploadArea = document.getElementById('uploadArea');
    const imageInput = document.getElementById('imageInput');
    const imagePreview = document.getElementById('imagePreview');
    const previewImg = document.getElementById('previewImg');
    const removeImageBtn = document.getElementById('removeImageBtn');

    let selectedImagePath = null;

    // 字符计数
    contentTextarea.addEventListener('input', () => {
      const len = contentTextarea.value.length;
      charCount.textContent = len;
      charCount.className = len > 1900 ? 'char-count over' : 'char-count';
    });

    // 点击上传区域触发文件选择
    uploadArea.addEventListener('click', () => imageInput.click());

    // 拖拽上传
    uploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#3b82f6';
      uploadArea.style.background = '#eff6ff';
    });

    uploadArea.addEventListener('dragleave', () => {
      uploadArea.style.borderColor = '#cbd5e1';
      uploadArea.style.background = '#f8fafc';
    });

    uploadArea.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadArea.style.borderColor = '#cbd5e1';
      uploadArea.style.background = '#f8fafc';
      if (e.dataTransfer.files.length > 0) {
        handleImageFile(e.dataTransfer.files[0]);
      }
    });

    // 文件选择处理
    imageInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        handleImageFile(e.target.files[0]);
      }
    });

    function handleImageFile(file) {
      if (!file.type.startsWith('image/')) {
        showStatus('请选择图片文件（JPG / PNG）', 'error');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        showStatus('图片大小不能超过 5MB', 'error');
        return;
      }

      // 显示预览
      const reader = new FileReader();
      reader.onload = (e) => {
        previewImg.src = e.target.result;
        imagePreview.style.display = 'block';
        uploadArea.style.display = 'none';
      };
      reader.readAsDataURL(file);

      // 保存文件路径（通过 IPC 传递 File 对象不行，需要复制到临时目录）
      // 我们将文件复制到应用的 temp 目录，保存路径用于 IPC 传输
      saveImageFile(file);
    }

    async function saveImageFile(file) {
      try {
        // 用 IPC 把文件写到临时目录
        const arrayBuffer = await file.arrayBuffer();
        const uint8 = new Uint8Array(arrayBuffer);
        const tempPath = await window.api.writeFile(
          null,
          { name: 'suggestion_' + Date.now() + '_' + file.name, data: uint8 },
          'suggestion_image'
        );
        // 如果 writeFile 不支持直接返回路径，用另一种方式
        // 我们直接通过 Electron 的 dialog 或临时文件 API
        // 简化方案：用 base64 通过 IPC 传输
        if (tempPath && typeof tempPath === 'string') {
          selectedImagePath = tempPath;
        } else {
          // 备用：直接用 file path
          selectedImagePath = file.path || null;
        }
      } catch (e) {
        console.warn('保存临时图片失败:', e);
        selectedImagePath = file.path || null;
      }
    }

    // 移除图片
    removeImageBtn.addEventListener('click', () => {
      imagePreview.style.display = 'none';
      previewImg.src = '';
      uploadArea.style.display = 'flex';
      imageInput.value = '';
      selectedImagePath = null;
    });

    function showStatus(msg, type) {
      statusMessage.textContent = msg;
      statusMessage.className = 'status-message ' + type;
    }

    async function handleSubmit() {
      const content = contentTextarea.value.trim();
      if (!content) {
        showStatus('请填写建议内容', 'error');
        contentTextarea.focus();
        return;
      }
      if (content.length < 5) {
        showStatus('建议内容太短，请至少输入 5 个字符', 'error');
        contentTextarea.focus();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading-spinner"></span>提交中...';
      showStatus('');

      try {
        // 如果有图片但 selectedImagePath 为空（因为 file.path 在 Electron 中可能不可用）
        // 重新从 input 获取
        if (imageInput.files.length > 0 && !selectedImagePath) {
          selectedImagePath = imageInput.files[0].path || null;
        }

        const res = await window.api.submitSuggestion(sid, content, selectedImagePath || null);

        if (res && res.ok) {
          showStatus('✅ 建议提交成功！感谢你的反馈 ❤️', 'success');
          contentTextarea.value = '';
          charCount.textContent = '0';
          // 清除图片
          imagePreview.style.display = 'none';
          previewImg.src = '';
          uploadArea.style.display = 'flex';
          imageInput.value = '';
          selectedImagePath = null;
          submitBtn.textContent = '提交成功 🎉';

          // 2 秒后恢复按钮并返回
          setTimeout(() => {
            history.back();
          }, 2000);
        } else {
          showStatus('❌ ' + (res?.error || '提交失败，请稍后重试'), 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = '提交建议';
        }
      } catch (e) {
        showStatus('❌ 网络异常: ' + (e.message || '请检查网络连接'), 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = '提交建议';
      }
    }
  </script>
</body>

</html>
