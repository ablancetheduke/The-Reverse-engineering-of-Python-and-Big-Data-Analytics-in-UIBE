<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>课程AI</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; frame-src 'self' https://lab.uibe.edu.cn https://lab.uibe.edu.cn:8999 file:; child-src 'self' https://lab.uibe.edu.cn https://lab.uibe.edu.cn:8999 file:;">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fa;
        }

        .back-btn {
            position: absolute;
            top: 15px;
            left: 14px;
            z-index: 10;
            padding: 6px 14px;
            border: 1px solid #d1d5db;
            border-radius: 999px;
            background: #ffffff;
            color: #111827;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .08);
        }

        .back-btn:hover {
            background: #f0f2f5;
        }

        webview {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }

        #fallback {
            position: absolute;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            font-size: 14px;
            color: #374151;
            background: #f9fafb;
            z-index: 9;
        }

        #fallback button {
            padding: 8px 16px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #fff;
            cursor: pointer;
        }

        #fallback button:hover {
            background: #f0f2f5;
        }
    </style>
</head>

<body>
    <div class="app-drag-region" style="position:absolute;top:0;left:0;right:0;height:40px;z-index:5;"></div>
    <button class="back-btn" onclick="history.back()">← 返回</button>

    <webview id="aiView" src="https://lab.uibe.edu.cn/aiagents" partition="persist:aiagents" allowpopups
        style="opacity:0;transition:opacity .25s;"></webview>

    <div id="fallback">
        <div id="fb-msg">正在加载，请稍候…</div>
        <div style="display:flex;gap:8px;">
            <button id="fb-retry">重试</button>
            <button id="fb-open">系统浏览器打开</button>
        </div>
    </div>

    <script>
        const targetUrl = 'https://lab.uibe.edu.cn/aiagents';
        const wv = document.getElementById('aiView');
        const fb = document.getElementById('fallback');
        const fbMsg = document.getElementById('fb-msg');
        const btnRetry = document.getElementById('fb-retry');
        const btnOpen = document.getElementById('fb-open');

        function showFallback(msg) {
            fbMsg.textContent = msg || '加载失败';
            fb.style.display = 'flex';
        }

        function hideFallback() {
            fb.style.display = 'none';
        }

        btnRetry.onclick = () => {
            hideFallback();
            wv.reload();
        };
        btnOpen.onclick = () => {
            if (window.api && window.api.openExternal) window.api.openExternal(targetUrl);
            else window.open(targetUrl, '_blank');
        };

        const timeout = setTimeout(() => {
            if (wv.style.opacity !== '1') showFallback('加载超时，重试或外部打开');
        }, 12000);

        wv.addEventListener('did-start-loading', hideFallback);
        wv.addEventListener('dom-ready', () => {
            clearTimeout(timeout);
            wv.style.opacity = '1';
        });
        wv.addEventListener('did-fail-load', (e) => {
            if (e.errorCode !== -3) showFallback(`加载失败(${e.errorCode}) ${e.errorDescription || ''}`);
        });
        wv.addEventListener('crashed', () => showFallback('渲染进程崩溃'));
        wv.addEventListener('gpu-crashed', () => showFallback('GPU 渲染异常'));
    </script>
</body>

</html>
